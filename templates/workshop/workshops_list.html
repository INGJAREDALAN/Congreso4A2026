{% extends "base.html" %}

{% block content %}

<style>
    .container {
        display: flex;
        justify-content: space-around;
        flex-wrap: nowrap;
        gap: 20px;
    }

    .card {
        width: 330px;
        border: 1px solid black;
        padding: 20px;
        border-radius: 10px;
    }
</style>



<div class = "container">
    {% for w in workshops %}
<div class = "card">
    <h2> {{ w.name }} </h2>
    <p> {{ w.classroom }}</p>
    <p> {{ w.date }} - {{ w.star_time }}</p>
</div>
    {%endblock%}
</div>

{% endblock %}
